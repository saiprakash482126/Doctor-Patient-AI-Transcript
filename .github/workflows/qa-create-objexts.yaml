name: Create Doctor Patient AI Transcript QA Kubernetes Objects

on:
  workflow_dispatch:

jobs:
  create-k8s-objects:
    runs-on: ubuntu-latest

    steps:

      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Configure Kubeconfig
      - name: Configure Kubeconfig
        shell: bash
        run: |
          echo "${{ secrets.RIMS_KUBE_CONFIG_QA }}" | base64 -d > kubeconfig.yaml

          export KUBECONFIG=$PWD/kubeconfig.yaml

          kubectl config current-context
          kubectl get nodes

      # Create Kubernetes Objects
      - name: Create Kubernetes Objects
        shell: bash
        run: |
          export KUBECONFIG=$PWD/kubeconfig.yaml

          kubectl apply -f .k8s/qa/namespace.yaml
          kubectl apply -f .k8s/qa/deployment.yaml
          kubectl apply -f .k8s/qa/service.yaml

          kubectl get pods -n qa
          kubectl get svc -n qa




          