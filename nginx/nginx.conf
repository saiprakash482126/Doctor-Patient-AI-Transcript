events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── WebSocket upgrade map ───────────────────────────────────────────────────
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # ── Serve Frontend ──────────────────────────────────────────────────────
    location / {
      root  /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # ── Proxy /health ───────────────────────────────────────────────────────
    location /health {
      proxy_pass         http://doctor-patient-ai-transcript:8000/health;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Proxy /livekit-token ────────────────────────────────────────────────
    location /livekit-token {
      proxy_pass         http://doctor-patient-ai-transcript:8000/livekit-token;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 30s;
    }

    # ── Proxy /generate-letter ──────────────────────────────────────────────
    location /generate-letter {
      proxy_pass         http://doctor-patient-ai-transcript:8000/generate-letter;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # ── Proxy /transcript ───────────────────────────────────────────────────
    location /transcript {
      proxy_pass         http://doctor-patient-ai-transcript:8000/transcript;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── WebSocket: /listen-auto ─────────────────────────────────────────────
    location /listen-auto {
      proxy_pass              http://doctor-patient-ai-transcript:8000/listen-auto;
      proxy_http_version      1.1;
      proxy_set_header        Upgrade $http_upgrade;
      proxy_set_header        Connection $connection_upgrade;
      proxy_set_header        Host $host;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_read_timeout      3600s;
      proxy_send_timeout      3600s;
    }

    # ── WebSocket: /listen (legacy) ─────────────────────────────────────────
    location /listen {
      proxy_pass              http://doctor-patient-ai-transcript:8000/listen;
      proxy_http_version      1.1;
      proxy_set_header        Upgrade $http_upgrade;
      proxy_set_header        Connection $connection_upgrade;
      proxy_set_header        Host $host;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_read_timeout      3600s;
      proxy_send_timeout      3600s;
    }
  }
}