version: "3.9"

networks:
  transcript-net:
    driver: bridge

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctor-patient-ai-transcript
    restart: unless-stopped
    networks:
      - transcript-net
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: transcript-nginx
    restart: unless-stopped
    networks:
      - transcript-net
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      backend:
        condition: service_healthy